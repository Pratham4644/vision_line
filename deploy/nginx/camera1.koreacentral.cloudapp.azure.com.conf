# Nginx configuration for Camera Streaming Platform on Azure VM
# Hostname: camera1.koreacentral.cloudapp.azure.com
# IP: 20.194.48.89

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name camera1.koreacentral.cloudapp.azure.com 20.194.48.89;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name camera1.koreacentral.cloudapp.azure.com;

    # SSL Certificate (Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/camera1.koreacentral.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/camera1.koreacentral.cloudapp.azure.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval' ws: wss:; connect-src 'self' http: https: ws: wss:;" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Client limits
    client_max_body_size 50M;

    # 1. Frontend UI Static Assets
    location / {
        root /opt/camera-platform/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
            expires 1M;
            access_log off;
            add_header Cache-Control "public";
        }
    }

    # 2. Backend FastAPI REST API, Healthcheck & OpenAPI
    location = /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # 3. MediaMTX WebRTC WHEP / WHIP Endpoints
    # MediaMTX listens on port 8889 for WebRTC HTTP WHEP signaling
    # Crucial Fix: Allow session subpaths (/<stream>/whep/<session-id>) so ICE trickle PATCH requests
    # reach MediaMTX rather than falling through to frontend index.html (which caused the ~40s ICE timeout).
    location ~* ^/(?<stream_path>[a-zA-Z0-9_\-]+)/(whep|whip)(/.*)?$ {
        proxy_pass http://127.0.0.1:8889;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
