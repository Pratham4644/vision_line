###############################################################################
# MediaMTX Configuration
###############################################################################

# ============================================================
# HLS
# ============================================================
# ============================================================
# HLS
# ============================================================
hls: yes
hlsAddress: :8888
hlsAllowOrigin: '*'
hlsVariant: mpegts
hlsSegmentDuration: 1s
hlsSegmentCount: 3


# ============================================================
# RTSP
# ============================================================

rtsp: yes
rtspAddress: :8554


# ============================================================
# WebRTC
# ============================================================

webrtc: yes
webrtcAddress: :8889

webrtcAllowOrigin: '*'


# ============================================================
# API
# ============================================================

api: yes
apiAddress: 127.0.0.1:9997


# ============================================================
# AUTHENTICATION
# ============================================================

authInternalUsers:

  # FFmpeg publisher
  - user: PS
    pass: Sasha123
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: api

  # Temporary browser read access
  - user: any
    pass:
    ips: []
    permissions:
      - action: read


# ============================================================
# CAMERA PATHS
# ============================================================
paths:
  cam1:
    source: publisher

  cam-hik1:
    source: publisher

  cam-hik2:
    source: publisher

  cam-hik3:
    source: publisher